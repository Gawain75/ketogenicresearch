name: Set official Health Icons syringe for GLP1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-healthicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply official Health Icons syringe outline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import re

          URL = "https://raw.githubusercontent.com/resolvetosavelives/healthicons/main/public/icons/svg/outline/devices/syringe.svg"
          svg = urlopen(URL, timeout=30).read().decode("utf-8").strip()
          if "<svg" not in svg or "</svg>" not in svg:
              raise SystemExit("STOP: official Health Icons SVG download failed")

          # Keep the official SVG content; normalize the root for inline display.
          root = re.search(r"<svg\b([^>]*)>", svg)
          if not root:
              raise SystemExit("STOP: invalid SVG")
          vb = re.search(r'viewBox="([^"]+)"', root.group(0))
          viewbox = vb.group(1) if vb else "0 0 48 48"
          svg = re.sub(r"<svg\b[^>]*>", f'<svg aria-hidden="true" viewBox="{viewbox}">', svg, count=1)

          # Current Library: ONLY icon inside GLP-1 folder.
          p = Path("library.html")
          html = p.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(<details\b[^>]*\bid="glp1-keto-metabolic-endocrine"[^>]*>\s*<summary>\s*)'
              r'(<span class="folder-icon[^"]*"[^>]*>.*?</span>)',
              re.S
          )
          matches = list(pattern.finditer(html))
          if len(matches) != 1:
              raise SystemExit(f"STOP: GLP-1 icon blocks in library.html = {len(matches)}, expected 1")
          m = matches[0]
          replacement = (
              m.group(1)
              + '<span class="folder-icon" data-icon-source="healthicons" '
                'data-icon-name="devices/syringe" data-icon-style="outline">'
              + svg + '</span>'
          )
          html = html[:m.start()] + replacement + html[m.end():]
          p.write_text(html, encoding="utf-8")

          # Generator: ONLY the current custom GLP-1 SVG.
          p = Path("scripts/maintain_obesity_glp1_keto.py")
          src = p.read_text(encoding="utf-8")
          old_svg = '''<svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M6 4v7m-2-4h4M5 4h2M5 11h2l1 3"></path>
          <path d="M12 16c0-3 3-5.5 3-8 0 2.5 3 5 3 8a3 3 0 0 1-6 0Z"></path>
          <path d="M9 18h2m-1-3v6"></path>
        </svg>'''
          if src.count(old_svg) != 1:
              raise SystemExit(f"STOP: current GLP-1 SVGs in generator = {src.count(old_svg)}, expected 1")
          src = src.replace(old_svg, svg, 1)
          p.write_text(src, encoding="utf-8")
          PY

      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(library\.html|scripts/maintain_obesity_glp1_keto\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "STOP: unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 2
          grep -q 'data-icon-source="healthicons"' library.html
          grep -q 'data-icon-name="devices/syringe"' library.html

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.html scripts/maintain_obesity_glp1_keto.py
          git commit -m "Use official Health Icons syringe for GLP1"
          git push origin main
