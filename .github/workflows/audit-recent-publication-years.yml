name: Audit recent publication years

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  audit-years:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Audit PubMed publication years
        env:
          YEAR_AUDIT_START: "2024"
          YEAR_AUDIT_END: "2026"
          YEAR_AUDIT_BATCH_MAX: "300"
          YEAR_AUDIT_REQUEST_CHUNK: "100"
          YEAR_AUDIT_PAUSE: "1.0"
        run: python scripts/audit_recent_publication_years.py

      - name: Rebuild evidence trends
        run: python scripts/build_evidence_trends.py

      - name: Commit audited years and trends
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html library-recent-year-audit-state.json data/evidence-trends.json evidence-trends.html *.html

          if git diff --cached --quiet; then
            echo "No recent publication year changes."
            exit 0
          fi

          git commit -m "Audit recent publication years"
          git pull --rebase origin main
          git push origin main
