name: Repair and translate Library Research details

on:
  workflow_dispatch:
    inputs:
      translation_checkpoints:
        description: "Italian translation checkpoints to run after restoring details"
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  repair-details:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install beautifulsoup4

      - name: Restore Research details to cards that are missing them
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/restore_library_research_details.py

      - name: Commit restored details before translation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.html research-details-backfill-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Restore Research details across Scientific Library"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Translate restored details in safe checkpoints
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DETAIL_TRANSLATION_BATCH_MAX: "10"
          DETAIL_TRANSLATION_MAX_CHARS: "6500"
          CHECKPOINTS: ${{ inputs.translation_checkpoints }}
        shell: bash
        run: |
          set -u
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "${CHECKPOINTS:-8}"); do
            echo "=== TRANSLATION CHECKPOINT ${i}/${CHECKPOINTS:-8} ==="

            git fetch origin main
            git rebase origin/main || exit 1

            set +e
            python scripts/translate_library_details.py
            status=$?
            set -e

            git add library.html library-details-translation-state.json 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Translate Research details checkpoint ${i}"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi

            if [ "$status" -ne 0 ]; then
              echo "Translation provider rate-limited. Completed checkpoints are already saved."
              exit 0
            fi

            sleep 75
          done
