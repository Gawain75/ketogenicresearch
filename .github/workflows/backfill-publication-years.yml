name: Backfill publication years

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  backfill-years:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Backfill missing publication years
        env:
          YEAR_BACKFILL_BATCH_MAX: "300"
          YEAR_BACKFILL_REQUEST_CHUNK: "100"
          YEAR_BACKFILL_PAUSE: "2"
        run: python scripts/backfill_publication_years.py

      - name: Rebuild evidence trends
        run: python scripts/build_evidence_trends.py

      - name: Commit updated years and trends
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html library-year-backfill-state.json data/evidence-trends.json evidence-trends.html *.html

          if git diff --cached --quiet; then
            echo "No publication year changes."
            exit 0
          fi

          git commit -m "Backfill publication years"
          git pull --rebase origin main
          git push origin main
