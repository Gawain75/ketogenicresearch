name: Backfill 2025 Scientific Library

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  backfill-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curator dependency
        run: python -m pip install beautifulsoup4

      - name: Discover missing 2025 literature
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          BACKFILL_MAX_RECORDS: "5000"
          RECONCILE_MAX: "0"
        run: python scripts/backfill_2025.py

      - name: Promote verified 2025 records - batch 1
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "400"
        run: python scripts/promote_auto_v5.py

      - name: Promote verified 2025 records - batch 2
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "400"
        run: python scripts/promote_auto_v5.py

      - name: Promote verified 2025 records - batch 3
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "400"
        run: python scripts/promote_auto_v5.py

      - name: Promote verified 2025 records - batch 4
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "400"
        run: python scripts/promote_auto_v5.py

      - name: Rebuild Evidence Trends
        run: |
          if [ -f scripts/build_evidence_trends.py ]; then
            python scripts/build_evidence_trends.py
          else
            echo "Evidence Trends builder not present; skipping."
          fi

      - name: Commit 2025 backfill
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add             library.html             index.html             script.js             review-queue.json             library-2025-backfill-report.json             data/evidence-trends.json             evidence-trends.html

          if git diff --cached --quiet; then
            echo "No 2025 Scientific Library changes."
            exit 0
          fi

          git commit -m "Backfill 2025 Scientific Library"
          git pull --rebase origin main
          git push origin main
