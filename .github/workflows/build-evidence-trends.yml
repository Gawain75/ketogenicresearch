name: Build evidence trends

on:
  workflow_dispatch:
  schedule:
    - cron: "12 5 * * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  evidence-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Build evidence trend data and page
        run: python scripts/build_evidence_trends.py

      - name: Commit evidence trends
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/evidence-trends.json evidence-trends.html *.html

          if git diff --cached --quiet; then
            echo "No evidence trend changes."
            exit 0
          fi

          git commit -m "Update evidence trends"
          git pull --rebase origin main
          git push origin main
