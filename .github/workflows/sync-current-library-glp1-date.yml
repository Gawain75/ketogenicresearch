name: Sync current Library GLP1 icon and date

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch only library.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("library.html")
          s = p.read_text(encoding="utf-8")
          old_icon = '''<svg aria-hidden="true" viewbox="0 0 24 24">
          <circle cx="6" cy="6" r="2"></circle>
          <path d="M6 8v3c0 2.2 1.8 4 4 4h2"></path>
          <path d="M16 4s3.5 3.8 3.5 6.5a3.5 3.5 0 0 1-7 0C12.5 7.8 16 4 16 4Z"></path>
          <path d="M10 18h8"></path>
          <path d="M14 15v6"></path>
          </svg>'''
          new_icon = '''<svg aria-hidden="true" viewbox="0 0 24 24">
          <path d="M6 4v7m-2-4h4M5 4h2M5 11h2l1 3"></path>
          <path d="M12 16c0-3 3-5.5 3-8 0 2.5 3 5 3 8a3 3 0 0 1-6 0Z"></path>
          <path d="M9 18h2m-1-3v6"></path>
          </svg>'''
          if s.count(old_icon) != 1:
              raise SystemExit(f"STOP: old GLP1 icon occurrences = {s.count(old_icon)}, expected 1")
          old_date = '<strong data-literature-update-date="">Sep 2026</strong>'
          new_date = '<strong data-literature-update-date="">1 ott 2026</strong>'
          if s.count(old_date) != 1:
              raise SystemExit(f"STOP: old static date occurrences = {s.count(old_date)}, expected 1")
          s = s.replace(old_icon, new_icon, 1).replace(old_date, new_date, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "library.html"
          grep -q '<strong data-literature-update-date="">1 ott 2026</strong>' library.html
          grep -q 'M6 4v7m-2-4h4M5 4h2M5 11h2l1 3' library.html

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.html
          git commit -m "Sync GLP1 icon and Library update date"
          git push origin main
