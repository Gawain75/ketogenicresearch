name: Synchronize publication counters

on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Synchronize homepage and Library counters
        run: |
          if [ -f scripts/sync_publication_counters.py ]; then
            python scripts/sync_publication_counters.py
          else
            python sync_publication_counters.py
          fi

      - name: Commit synchronized counters
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html library.html

          if git diff --cached --quiet; then
            echo "Counters already synchronized."
            exit 0
          fi

          git commit -m "Synchronize publication counters"
          git pull --rebase origin main
          git push origin main
