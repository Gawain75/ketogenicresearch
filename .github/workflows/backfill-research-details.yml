name: Backfill Research details across Library

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Backfill Research details
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/restore_library_research_details.py

      - name: Validate complete coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          soup = BeautifulSoup(
              Path("library.html").read_text(encoding="utf-8"),
              "html.parser",
          )
          cards = soup.select("article.folder-paper")
          missing = [
              c for c in cards
              if c.select_one("details.paper-study-details") is None
          ]
          print(f"Library cards: {len(cards)}")
          print(f"Cards without Research details: {len(missing)}")
          if missing:
              raise SystemExit("Research-details coverage is incomplete.")
          PY

      - name: Commit Research details backfill
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html research-details-backfill-report.json scripts/restore_library_research_details.py scripts/promote_auto.py

          if git diff --cached --quiet; then
            echo "No Research details changes to commit."
            exit 0
          fi

          git commit -m "Backfill Research details across Scientific Library"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
