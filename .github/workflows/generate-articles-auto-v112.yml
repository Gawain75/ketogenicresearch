name: Generate research article

on:
  workflow_run:
    workflows:
      - "Update latest scientific literature"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  generate-article:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install article dependencies
        run: python -m pip install pypdf

      - name: Generate and verify one article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/generate_articles.py

      - name: Render public article pages
        run: python scripts/render_articles.py

      - name: Commit verified article and public pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No verified article changes."
            exit 0
          fi

          git commit -m "Generate and publish verified research article"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected changes remained after commit:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push completed successfully."
              exit 0
            fi

            echo "Remote main changed before push; retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
