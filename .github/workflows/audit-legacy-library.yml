name: Audit legacy Library records

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Audit next legacy batch
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          AUDIT_BATCH: "150"
        run: python scripts/audit_legacy_library.py

      - name: Commit audit state and report
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add             library-legacy-audit.json             library-legacy-audit-state.json

          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi

          git commit -m "Audit legacy Scientific Library records"
          git pull --rebase origin main
          git push origin main
