name: Repair Full Text + PDF links

on:
  workflow_dispatch:
  schedule:
    - cron: "52 5 * * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  repair-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTML parser dependency
        run: python -m pip install beautifulsoup4

      - name: Verify every Full Text link against PubMed
        run: |
          if [ -f scripts/repair_fulltext_links.py ]; then
            python scripts/repair_fulltext_links.py
          elif [ -f repair_fulltext_links.py ]; then
            python repair_fulltext_links.py
          else
            echo "ERROR: repair_fulltext_links.py not found."
            exit 2
          fi

      - name: Commit repaired links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No Full Text/PDF link changes."
            exit 0
          fi

          git commit -m "Verify Full Text and direct PDF links"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected changes remained after commit:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push completed successfully."
              exit 0
            fi

            echo "Remote main changed before push; retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
