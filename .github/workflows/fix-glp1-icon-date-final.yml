name: Fix GLP1 icon and library date

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime

          # --- Exact SVG currently present in library.html and in the generator ---
          old_svg_html = """<svg aria-hidden="true" viewbox="0 0 24 24">
          <circle cx="6" cy="6" r="2"></circle>
          <path d="M6 8v3c0 2.2 1.8 4 4 4h2"></path>
          <path d="M16 4s3.5 3.8 3.5 6.5a3.5 3.5 0 0 1-7 0C12.5 7.8 16 4 16 4Z"></path>
          <path d="M10 18h8"></path>
          <path d="M14 15v6"></path>
          </svg>"""
          new_svg_html = """<svg aria-hidden="true" viewbox="0 0 24 24">
          <path d="M6 4v7m-2-4h4M5 4h2M5 11h2l1 3"></path>
          <path d="M12 16c0-3 3-5.5 3-8 0 2.5 3 5 3 8a3 3 0 0 1-6 0Z"></path>
          <path d="M9 18h2m-1-3v6"></path>
          </svg>"""

          old_svg_py = """<svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="6" cy="6" r="2"></circle>
                    <path d="M6 8v3c0 2.2 1.8 4 4 4h2"></path>
                    <path d="M16 4s3.5 3.8 3.5 6.5a3.5 3.5 0 0 1-7 0C12.5 7.8 16 4 16 4Z"></path>
                    <path d="M10 18h8"></path>
                    <path d="M14 15v6"></path>
                  </svg>"""
          new_svg_py = """<svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M6 4v7m-2-4h4M5 4h2M5 11h2l1 3"></path>
                    <path d="M12 16c0-3 3-5.5 3-8 0 2.5 3 5 3 8a3 3 0 0 1-6 0Z"></path>
                    <path d="M9 18h2m-1-3v6"></path>
                  </svg>"""

          # 1) Fix the icon already embedded in the current 78 MB library.html.
          p = Path("library.html")
          html = p.read_text(encoding="utf-8")
          if html.count(old_svg_html) != 1:
              raise SystemExit(f"STOP: expected 1 current GLP-1 SVG in library.html, found {html.count(old_svg_html)}")
          html = html.replace(old_svg_html, new_svg_html, 1)

          # 2) Align the initial visible date with latest-publications.json.
          data = json.loads(Path("latest-publications.json").read_text(encoding="utf-8"))
          raw = data.get("content_updated_at") or data.get("generated_at")
          if not raw:
              raise SystemExit("STOP: no update timestamp in latest-publications.json")
          dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          months_it = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"]
          initial_it = f"{dt.day} {months_it[dt.month-1]} {dt.year}"
          old_date = '<strong data-literature-update-date="">Sep 2026</strong>'
          if html.count(old_date) != 1:
              raise SystemExit(f"STOP: expected 1 static Sep 2026 date, found {html.count(old_date)}")
          html = html.replace(old_date, f'<strong data-literature-update-date="">{initial_it}</strong>', 1)

          # Cache-bust script.js.
          if html.count("script.js?v=71") != 1:
              raise SystemExit(f"STOP: expected 1 script.js?v=71 reference, found {html.count('script.js?v=71')}")
          html = html.replace("script.js?v=71", "script.js?v=73", 1)
          p.write_text(html, encoding="utf-8")

          # 3) Fix the generator so future rebuilds keep the same GLP-1 icon.
          p = Path("scripts/maintain_obesity_glp1_keto.py")
          src = p.read_text(encoding="utf-8")
          if src.count(old_svg_py) != 1:
              raise SystemExit(f"STOP: expected 1 old GLP-1 SVG in generator, found {src.count(old_svg_py)}")
          p.write_text(src.replace(old_svg_py, new_svg_py, 1), encoding="utf-8")

          # 4) Make JS show day + month + year.
          p = Path("script.js")
          js = p.read_text(encoding="utf-8")
          old_fmt = """      {
                  month: 'short',
                  year: 'numeric'
                }"""
          new_fmt = """      {
                  day: 'numeric',
                  month: 'short',
                  year: 'numeric'
                }"""
          if js.count(old_fmt) != 1:
              raise SystemExit(f"STOP: expected 1 date formatter, found {js.count(old_fmt)}")
          p.write_text(js.replace(old_fmt, new_fmt, 1), encoding="utf-8")
          PY

      - name: Safety check and commit
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"
          echo "$changed"

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(library\.html|script\.js|scripts/maintain_obesity_glp1_keto\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "STOP: unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "STOP: expected exactly 3 changed files, found $count"
            exit 1
          fi

          grep -q "day: 'numeric'" script.js
          grep -q 'M6 4v7m-2-4h4M5 4h2M5 11h2l1 3' library.html
          grep -q 'M6 4v7m-2-4h4M5 4h2M5 11h2l1 3' scripts/maintain_obesity_glp1_keto.py
          grep -q 'script.js?v=73' library.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.html script.js scripts/maintain_obesity_glp1_keto.py
          git commit -m "Fix GLP1 icon and full library update date"
          git push origin main
