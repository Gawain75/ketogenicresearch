name: Apply integrity upgrade

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install beautifulsoup4 pypdf

      - name: Apply source-integrity upgrade
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/apply_integrity_upgrade.py

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Regenerate PMID 42709766 from authoritative source
        env:
          TARGET_PMID: "42709766"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          MAX_CANDIDATE_SCAN: "1"
        shell: bash
        run: |
          set -euo pipefail
          cp latest-publications.json /tmp/latest-publications.json
          restore_latest() { cp /tmp/latest-publications.json latest-publications.json; }
          trap restore_latest EXIT

          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("latest-publications.json")
          obj = json.loads(path.read_text(encoding="utf-8"))
          target = os.environ["TARGET_PMID"]
          pubs = [p for p in obj.get("publications", []) if str(p.get("pmid", "")).strip() == target]
          if not pubs:
              raise SystemExit(f"Target PMID {target} not found in latest-publications.json")
          for p in pubs:
              p["status"] = "new"
          obj["publications"] = pubs
          path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          python scripts/generate_articles.py
          restore_latest
          trap - EXIT

      - name: Cooldown
        run: sleep 90

      - name: Regenerate PMID 42760380 from authoritative source
        env:
          TARGET_PMID: "42760380"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          MAX_CANDIDATE_SCAN: "1"
        shell: bash
        run: |
          set -euo pipefail
          cp latest-publications.json /tmp/latest-publications.json
          restore_latest() { cp /tmp/latest-publications.json latest-publications.json; }
          trap restore_latest EXIT

          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("latest-publications.json")
          obj = json.loads(path.read_text(encoding="utf-8"))
          target = os.environ["TARGET_PMID"]
          pubs = [p for p in obj.get("publications", []) if str(p.get("pmid", "")).strip() == target]
          if not pubs:
              raise SystemExit(f"Target PMID {target} not found in latest-publications.json")
          for p in pubs:
              p["status"] = "new"
          obj["publications"] = pubs
          path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          python scripts/generate_articles.py
          restore_latest
          trap - EXIT

      - name: Audit every generated article against PubMed identity
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/audit_article_sources.py

      - name: Rebuild public pages and counters
        run: |
          python scripts/render_articles.py
          python scripts/sync_publication_counters.py
          python scripts/build_evidence_trends.py

      - name: Final syntax checks
        run: |
          python -m py_compile \
            scripts/update_latest.py \
            scripts/generate_articles.py \
            scripts/audit_article_sources.py \
            scripts/render_articles.py \
            scripts/sync_publication_counters.py \
            scripts/library_v5.py \
            scripts/promote_auto_v5.py
          node --check script.js

      - name: Commit complete integrity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Hard safety guard: never let this workflow commit changes under .github/workflows,
          # because the Actions token may lack the special "workflows" permission.
          git restore --source=HEAD --staged --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          git add -A

          # Remove any staged or unstaged workflow-file changes before committing.
          git restore --staged .github/workflows || true
          git restore --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          if git diff --cached --quiet; then
            echo "Integrity upgrade already applied."
          else
            git commit -m "Harden scientific source integrity"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Disable duplicate automatic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for wf in \
            update-literature-doi-guard.yml \
            update-literature-with-title-translation.yml \
            generate-articles-auto-v3_7.yml \
            expand-scientific-library-v5.yml \
            expand-scientific-library-v5_1.yml
          do
            echo "Disabling duplicate/legacy workflow: $wf"
            gh workflow disable "$wf" --repo "${{ github.repository }}" || true
          done

      - name: Summary
        run: |
          echo "Integrity upgrade completed."
          echo "Workflow-file changes were intentionally excluded from the commit."
          echo "Known contaminated articles were regenerated from authoritative PubMed identity."
