name: Apply integrity upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Apply source-integrity and workflow upgrade
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/apply_integrity_upgrade.py

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Show active workflows
        run: find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort

      - name: Commit upgrade
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Integrity upgrade already applied."
            exit 0
          fi
          git commit -m "Harden scientific source integrity and workflows"
          git pull --rebase origin main
          git push origin main
