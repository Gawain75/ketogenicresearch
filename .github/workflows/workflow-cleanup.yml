name: Maintenance · Workflow cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean workflow directory
        run: python scripts/cleanup_workflows.py

      - name: Show active workflows
        run: |
          echo "Active workflow files:"
          find .github/workflows -maxdepth 1 -type f -print | sort

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean and consolidate GitHub Actions workflows"
          git push
