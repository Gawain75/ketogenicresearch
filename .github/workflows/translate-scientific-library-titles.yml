name: Translate Scientific Library titles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Translate next Library title batch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          TRANSLATION_BATCH_MAX: "120"
        run: python scripts/translate_library_titles.py

      - name: Commit translated titles
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html library-title-translation-state.json

          if git diff --cached --quiet; then
            echo "No title translations changed."
            exit 0
          fi

          git commit -m "Translate Scientific Library titles"
          git pull --rebase origin main
          git push origin main
