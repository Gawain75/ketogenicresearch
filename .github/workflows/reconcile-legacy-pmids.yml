name: Reconcile legacy Library PMIDs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Reconcile up to 25 legacy cards
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          RECONCILE_MAX: "25"
        run: python scripts/reconcile_legacy_pmids.py

      - name: Commit verified PMID/DOI links
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html library-legacy-reconcile-report.json

          if git diff --cached --quiet; then
            echo "No legacy cards were reconciled."
            exit 0
          fi

          git commit -m "Reconcile legacy Library records with PubMed"
          git pull --rebase origin main
          git push origin main
