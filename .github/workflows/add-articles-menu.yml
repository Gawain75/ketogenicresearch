name: Add Articles menu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-articles-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Articles link to site navigation
        run: python scripts/add_articles_menu.py

      - name: Commit navigation update
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add             index.html             research.html             library.html             latest.html             methodology.html             director.html             contact.html

          if git diff --cached --quiet; then
            echo "Articles menu already present."
          else
            git commit -m "Add Articles to site navigation"
            git push
          fi
