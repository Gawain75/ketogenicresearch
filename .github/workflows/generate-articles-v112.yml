name: AI article pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-article-pilot
  cancel-in-progress: false

jobs:
  generate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install article dependencies
        run: python -m pip install pypdf

      - name: Generate and verify one article draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/generate_articles.py

      - name: Render public article pages
        run: python scripts/render_articles.py

      - name: Commit verified article and public pages
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles-drafts/ articles/ articles.html
          if git diff --cached --quiet; then
            echo "No verified article changes."
          else
            git commit -m "Generate and publish verified research article"
            git push
          fi
