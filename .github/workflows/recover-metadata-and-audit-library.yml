name: Recover metadata and audit Scientific Library

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 1 * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  recover-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Recover missing publication metadata
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          METADATA_RECOVERY_TITLE_MAX: "350"
          METADATA_RECOVERY_PAUSE: "0.12"
        run: python scripts/recover_missing_metadata.py

      - name: Rebuild Evidence Trends after metadata recovery
        run: python scripts/build_evidence_trends.py

      - name: Reset completeness audit snapshot
        run: |
          rm -f historical-gap-audit-state.json
          rm -f historical-gap-audit.json
          rm -f historical-gap-candidates.json

      - name: Audit full PubMed coverage
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          HISTORICAL_AUDIT_START_YEAR: "2026"
          HISTORICAL_AUDIT_END_YEAR: "1921"
          HISTORICAL_AUDIT_YEARS_PER_RUN: "10"
        shell: bash
        run: |
          set -u
          completed=0

          for batch in $(seq 1 12); do
            echo "=== PubMed audit batch ${batch}/12 ==="
            success=0

            for attempt in 1 2 3 4; do
              if python scripts/audit_historical_gaps.py; then
                success=1
                break
              fi

              wait=$((attempt * 20))
              echo "Audit batch failed; retry ${attempt}/4 in ${wait}s"
              sleep "$wait"
            done

            if [ "$success" -ne 1 ]; then
              echo "Audit failed after 4 batch-level attempts."
              exit 1
            fi

            if python -c 'import json; from pathlib import Path; p=Path("historical-gap-audit-state.json"); state=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; raise SystemExit(0 if state.get("completed") else 1)'; then
              completed=1
              echo "Full PubMed audit completed."
              break
            fi
          done

          if [ "$completed" -ne 1 ]; then
            echo "Audit did not complete the full requested year range."
            exit 1
          fi

      - name: Queue high-confidence missing publications
        run: python scripts/queue_historical_gap_candidates.py

      - name: Promote only PubMed-reverified candidates
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "600"
        run: python scripts/promote_auto_v5.py

      - name: Rebuild Evidence Trends after library completion
        run: python scripts/build_evidence_trends.py

      - name: Synchronize publication counters
        run: python scripts/sync_publication_counters.py

      - name: Commit recovered metadata and verified additions
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            library.html \
            index.html \
            script.js \
            review-queue.json \
            publication-metadata-recovery.json \
            historical-gap-audit-state.json \
            historical-gap-audit.json \
            historical-gap-candidates.json \
            historical-gap-queue-report.json \
            data/evidence-trends.json \
            evidence-trends.html

          if git diff --cached --quiet; then
            echo "No Scientific Library changes."
            exit 0
          fi

          git commit -m "Recover bibliography metadata and close library gaps"
          git pull --rebase origin main
          git push origin main
