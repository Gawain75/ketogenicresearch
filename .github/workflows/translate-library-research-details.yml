name: Translate Library Research details - checkpointed

on:
  workflow_dispatch:
    inputs:
      checkpoints:
        description: "Maximum checkpoints in this run"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  translate-details:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install beautifulsoup4

      - name: Translate and checkpoint
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DETAIL_TRANSLATION_BATCH_MAX: "10"
          DETAIL_TRANSLATION_MAX_CHARS: "6500"
          CHECKPOINTS: ${{ inputs.checkpoints }}
        shell: bash
        run: |
          set -u
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "${CHECKPOINTS:-12}"); do
            echo "=== CHECKPOINT ${i}/${CHECKPOINTS:-12} ==="
            git fetch origin main
            git rebase origin/main || exit 1

            set +e
            python scripts/translate_library_details.py
            status=$?
            set -e

            git add library.html library-details-translation-state.json 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Translate Research details checkpoint ${i}"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi

            if [ "$status" -ne 0 ]; then
              echo "Translation provider rate-limited this checkpoint."
              echo "All completed translations have been committed. Run again later to continue."
              exit 0
            fi

            if python - <<'PY'
          import json
          from pathlib import Path
          p=Path("library-details-translation-state.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          raise SystemExit(0 if s.get("completed") else 1)
          PY
            then
              echo "All details translated."
              exit 0
            fi

            sleep 75
          done

          echo "Checkpoint limit reached. Run workflow again to continue."
