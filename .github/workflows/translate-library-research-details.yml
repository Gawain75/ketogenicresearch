name: Translate Library Research details

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Translation batches to run in this workflow"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  translate-details:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Translate Research details into Italian
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DETAIL_TRANSLATION_BATCH_MAX: "60"
          DETAIL_TRANSLATION_MAX_CHARS: "22000"
          ROUNDS: ${{ inputs.rounds }}
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 "${ROUNDS:-10}"); do
            echo "=== Translation round ${i}/${ROUNDS:-10} ==="
            python scripts/translate_library_details.py

            if python - <<'PY'
          import json
          from pathlib import Path
          p = Path("library-details-translation-state.json")
          state = json.loads(p.read_text(encoding="utf-8"))
          raise SystemExit(0 if state.get("completed") else 1)
          PY
            then
              echo "All Research details are translated."
              break
            fi
          done

      - name: Commit translated details
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html library-details-translation-state.json

          if git diff --cached --quiet; then
            echo "No Research-detail translations changed."
            exit 0
          fi

          git commit -m "Translate Library Research details into Italian"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1
