name: Reconcile unresolved legacy Library records

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-unresolved-legacy-library
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Reconcile unresolved records against PubMed and Crossref
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/reconcile_unresolved_legacy.py
      - name: Commit reconciled metadata
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.html legacy-library-reconciliation-report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Reconcile unresolved legacy Library records"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
