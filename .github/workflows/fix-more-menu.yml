name: Fix More menu

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  fix-more-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix More menu
        run: |
          if [ -f scripts/fix_more_menu.py ]; then
            python scripts/fix_more_menu.py
          else
            python fix_more_menu.py
          fi

      - name: Commit changes
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.html styles.css

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Fix More menu on desktop and mobile"
          git pull --rebase origin main
          git push origin main
