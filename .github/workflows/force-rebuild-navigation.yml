name: Force rebuild navigation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  rebuild-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force rebuild navigation
        run: |
          if [ -f scripts/force_rebuild_navigation.py ]; then
            python scripts/force_rebuild_navigation.py
          else
            python force_rebuild_navigation.py
          fi

      - name: Show changes
        run: |
          git status --short
          git diff --stat

      - name: Commit navigation rebuild
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: no navigation changes were produced."
            exit 2
          fi

          git commit -m "Force rebuild primary navigation"
          git pull --rebase origin main
          git push origin main
