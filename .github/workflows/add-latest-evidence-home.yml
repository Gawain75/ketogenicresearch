name: Add Latest Evidence to homepage

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  homepage-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Latest Evidence homepage section
        run: |
          if [ -f scripts/add_latest_evidence_home.py ]; then
            python scripts/add_latest_evidence_home.py
          else
            python add_latest_evidence_home.py
          fi

      - name: Commit homepage
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html styles.css

          if git diff --cached --quiet; then
            echo "No homepage changes."
            exit 0
          fi

          git commit -m "Add Latest Evidence to homepage"
          git pull --rebase origin main
          git push origin main
