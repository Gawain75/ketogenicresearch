name: Fix GLP1 icon and full update date

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply permanent fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Full day/month/year in the live "last updated" label.
          js = Path("script.js")
          s = js.read_text(encoding="utf-8")
          old = """      {
                month: 'short',
                year: 'numeric'
              }
"""
          new = """      {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
              }
"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # Target only the formatter used by content_updated_at/generated_at.
              anchor = "const literatureUpdatedAt ="
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit("Could not find literatureUpdatedAt formatter")
              tail = s[pos:]
              tail2, n = re.subn(
                  r"(\{\s*)(month:\s*'short',\s*year:\s*'numeric')",
                  r"\1day: 'numeric',\n        \2",
                  tail,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Could not patch full update date")
              s = s[:pos] + tail2
          js.write_text(s, encoding="utf-8")

          # 2) Make the daily GLP-1 maintenance script generate the definitive icon,
          #    so future rebuilds cannot restore the old icon.
          definitive_svg = '''<svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M6 4v7m-2-4h4M5 4h2M5 11h2l1 3"></path>
          <path d="M12 16c0-3 3-5.5 3-8 0 2.5 3 5 3 8a3 3 0 0 1-6 0Z"></path>
          <path d="M9 18h2m-1-3v6"></path>
        </svg>'''

          for name in ["scripts/maintain_obesity_glp1_keto.py", "maintain_obesity_glp1_keto.py"]:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")
              marker = 'icon["data-icon-family"] = "metabolic"'
              start = t.find(marker)
              if start < 0:
                  raise SystemExit(f"GLP-1 icon anchor missing in {name}")
              svg_start = t.find("<svg", start)
              svg_end = t.find("</svg>", svg_start)
              if svg_start < 0 or svg_end < 0:
                  raise SystemExit(f"GLP-1 SVG missing in {name}")
              svg_end += len("</svg>")
              t = t[:svg_start] + definitive_svg + t[svg_end:]
              p.write_text(t, encoding="utf-8")

          # 3) Cache-bust script.js without manually uploading the 78 MB library.html.
          lib = Path("library.html")
          h = lib.read_text(encoding="utf-8")
          h2, n = re.subn(r'script\.js\?v=\d+', 'script.js?v=72', h, count=1)
          if n != 1:
              raise SystemExit("Could not update script.js cache version in library.html")
          lib.write_text(h2, encoding="utf-8")

          print("Permanent GLP-1 icon fix applied")
          print("Full day/month/year update date applied")
          print("script.js cache version bumped to v72")

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q "day: 'numeric'" script.js
          grep -q 'M6 4v7m-2-4h4M5 4h2M5 11h2l1 3' scripts/maintain_obesity_glp1_keto.py
          grep -q 'script.js?v=72' library.html

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js library.html scripts/maintain_obesity_glp1_keto.py
          if [ -f maintain_obesity_glp1_keto.py ]; then git add maintain_obesity_glp1_keto.py; fi
          if git diff --cached --quiet; then
            echo "Fixes already present."
          else
            git commit -m "Permanently fix GLP1 icon and full update date"
            git pull --rebase origin main
            git push origin main
          fi
