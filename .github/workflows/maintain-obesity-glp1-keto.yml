name: Maintain Obesity GLP-1 ketogenic subsection

on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * *"
  workflow_run:
    workflows:
      - "Expand Scientific Library V5"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  maintain-subsection:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Rebuild static Obesity GLP-1RA ketogenic subsection
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/maintain_obesity_glp1_keto.py

      - name: Commit subsection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          git add library.html styles.css scripts/maintain_obesity_glp1_keto.py

          if git diff --cached --quiet; then
            echo "GLP-1RA ketogenic subsection already current."
          else
            git commit -m "Maintain Obesity GLP-1 ketogenic subsection"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Summary
        run: |
          echo "Obesity > GLP-1RA + ketogenic / ketosis / ketones rebuilt from PubMed."
          echo "This subsection is static HTML and does not depend on custom JavaScript."
