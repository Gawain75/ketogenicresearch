name: Restore Library Research Details

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  restore-details:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Restore source-grounded research details
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/restore_library_research_details.py

      - name: Commit restored Library details
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add library.html

          if git diff --cached --quiet; then
            echo "No Library detail changes."
            exit 0
          fi

          git commit -m "Restore source-grounded Library research details"
          git pull --rebase origin main
          git push origin main
