name: Emphasize research navigation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emphasize research and clarify areas
        run: |
          if [ -f scripts/emphasize_research_navigation.py ]; then
            python scripts/emphasize_research_navigation.py
          else
            python emphasize_research_navigation.py
          fi
      - name: Commit changes
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html styles.css
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Emphasize research navigation and area taxonomy"
          git pull --rebase origin main
          git push origin main
