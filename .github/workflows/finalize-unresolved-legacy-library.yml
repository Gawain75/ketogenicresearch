name: Finalize unresolved legacy Library records

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Finalize unresolved legacy records
        run: python scripts/finalize_unresolved_legacy.py
      - name: Commit Library cleanup and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.html legacy-library-finalization-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Finalize unresolved legacy Library records"
          git push
