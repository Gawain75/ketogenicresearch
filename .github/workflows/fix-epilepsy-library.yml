name: Fix Epilepsy Library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Apply epilepsy corrections
        run: python scripts/fix_epilepsy_library.py
      - name: Commit corrected Library
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- library.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.html
          git commit -m "Fix epilepsy historical records and links"
          git push
