name: Update latest scientific literature

on:
  schedule:
    # Primary daily PubMed surveillance run.
    - cron: "17 3 * * *"
    # Safety run: starts only if today's primary search did not complete.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-literature
  cancel-in-progress: false

jobs:
  update-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether this run is needed
        id: guard
        shell: bash
        run: |
          # Manual runs and the primary schedule always execute.
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" != "47 3 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Primary/manual run: proceeding."
            exit 0
          fi

          # The safety schedule runs only when latest-publications.json has not
          # already been generated today (UTC). This also retries automatically
          # when PubMed returned no records and the previous state was preserved.
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          path = Path("latest-publications.json")
          generated_date = None
          if path.exists():
              try:
                  generated = json.loads(path.read_text(encoding="utf-8")).get("generated_at")
                  if generated:
                      generated_date = dt.datetime.fromisoformat(
                          str(generated).replace("Z", "+00:00")
                      ).astimezone(dt.timezone.utc).date()
              except Exception as exc:
                  print(f"Could not read current generated_at: {exc}")

          today = dt.datetime.now(dt.timezone.utc).date()
          should_run = generated_date != today
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")

          if should_run:
              print(f"Safety run required: latest successful search is {generated_date or 'unknown'}, today is {today}.")
          else:
              print(f"Safety run skipped: literature search already completed on {today}.")
          PY

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curator dependency
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pip install beautifulsoup4

      - name: Preserve previous Latest Evidence state
        if: steps.guard.outputs.should_run == 'true'
        run: cp latest-publications.json /tmp/latest-publications-before.json || true

      - name: Update and categorize PubMed literature
        if: steps.guard.outputs.should_run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          WINDOW_DAYS: "90"
          CURATION_WINDOW_DAYS: "365"
          MAX_RECORDS: "100"
          CURATION_MAX_RECORDS: "2000"
        run: python scripts/update_latest.py

      - name: Stamp evidence verification and content update dates
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/stamp_literature_status.py /tmp/latest-publications-before.json

      - name: Auto-promote eligible publications
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/promote_auto.py

      - name: Translate new Research details into Italian
        if: steps.guard.outputs.should_run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DETAIL_TRANSLATION_BATCH_MAX: "10"
          DETAIL_TRANSLATION_MAX_CHARS: "6500"
        run: python scripts/translate_library_details.py
        continue-on-error: true

      - name: Apply clinical-area rationales
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/apply_clinical_rationales.py

      - name: Recover missing publication years
        if: steps.guard.outputs.should_run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          YEAR_RECOVERY_TITLE_MAX: "40"
          YEAR_RECOVERY_RETRY_DAYS: "30"
        run: python scripts/repair_missing_publication_years.py

      - name: Rebuild Evidence Trends
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/build_evidence_trends.py

      - name: Commit changes
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage every generated change so the working tree is clean before rebase.
          git add -A

          if git diff --cached --quiet; then
            echo "No literature changes."
          else
            git commit -m "Update literature, clinical rationales and evidence trends"
            git pull --rebase origin main
            git push origin main
          fi
