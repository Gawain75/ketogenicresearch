name: Audit historical Library gaps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  audit-historical-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Audit next historical year batch
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          BACKFILL_MAX_RECORDS: "5000"
          RECONCILE_MAX: "0"
          HISTORICAL_AUDIT_START_YEAR: "2025"
          HISTORICAL_AUDIT_END_YEAR: "1921"
          HISTORICAL_AUDIT_YEARS_PER_RUN: "10"
        run: |
          if [ -f scripts/audit_historical_gaps.py ]; then
            python scripts/audit_historical_gaps.py
          elif [ -f audit_historical_gaps.py ]; then
            python audit_historical_gaps.py
          else
            echo "ERROR: audit_historical_gaps.py not found."
            exit 2
          fi

      - name: Show generated changes
        run: git status --short

      - name: Commit audit report
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The runner starts from a clean checkout, so every change here
          # was generated by this audit run. Stage all of them to avoid
          # leaving tracked files unstaged before the rebase.
          git add -A

          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi

          git commit -m "Audit historical Scientific Library gaps"

          # Working tree must be clean before rebase.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected working-tree changes after commit:"
            git status --short
            git add -A
            git commit -m "Capture audit side effects" || true
          fi

          git pull --rebase origin main
          git push origin main
