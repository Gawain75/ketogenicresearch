name: Update latest scientific literature

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  update-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curator dependency
        run: python -m pip install beautifulsoup4

      - name: Update and categorize PubMed literature
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          WINDOW_DAYS: "90"
          CURATION_WINDOW_DAYS: "365"
          MAX_RECORDS: "100"
          CURATION_MAX_RECORDS: "500"
        run: python scripts/update_latest.py

      - name: Promote only PubMed-verified publications
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/promote_auto.py

      - name: Translate untranslated Library titles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          TRANSLATION_BATCH_MAX: "120"
        run: python scripts/translate_library_titles.py

      - name: Commit literature updates
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add             latest-publications.json             review-queue.json             library.html             index.html             script.js             styles.css \
            library-title-translation-state.json

          if git diff --cached --quiet; then
            echo "No literature changes."
            exit 0
          fi

          git commit -m "Update scientific literature with verified bibliography"
          git pull --rebase origin main
          git push origin main
