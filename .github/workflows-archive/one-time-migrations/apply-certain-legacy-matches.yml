name: Apply certain legacy PMID matches

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  apply-certain:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Apply only certain audit matches
        run: python scripts/apply_certain_legacy_matches.py

      - name: Re-audit DOI links
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/repair_library_doi_links.py

      - name: Commit verified legacy links
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.html library-legacy-apply-report.json library-doi-audit.json
          if git diff --cached --quiet; then
            echo "No certain legacy matches were applied."
            exit 0
          fi
          git commit -m "Apply verified legacy PubMed matches"
          git pull --rebase origin main
          git push origin main
