name: Keep Evidence Trends responsive

on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  responsive-evidence-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Evidence Trends charts responsive
        run: |
          if [ -f scripts/make_evidence_trends_responsive.py ]; then
            python scripts/make_evidence_trends_responsive.py
          else
            python make_evidence_trends_responsive.py
          fi

      - name: Commit responsive chart
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add evidence-trends.html

          if git diff --cached --quiet; then
            echo "Evidence Trends already responsive."
            exit 0
          fi

          git commit -m "Make Evidence Trends charts responsive"
          git pull --rebase origin main
          git push origin main
