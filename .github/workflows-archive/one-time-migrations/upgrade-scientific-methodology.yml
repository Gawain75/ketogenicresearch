name: Upgrade scientific methodology page

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  methodology:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade methodology page
        run: python scripts/update_methodology_institutional.py

      - name: Commit methodology page
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add methodology.html

          if git diff --cached --quiet; then
            echo "No methodology changes."
            exit 0
          fi

          git commit -m "Strengthen scientific methodology page"
          git pull --rebase origin main
          git push origin main
