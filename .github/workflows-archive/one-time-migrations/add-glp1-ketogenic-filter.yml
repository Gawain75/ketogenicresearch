name: Add GLP-1 ketogenic filter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  add-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add thematic filter
        run: python scripts/add_glp1_keto_filter.py

      - name: Verify JavaScript
        run: node --check script.js

      - name: Commit filter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          git add library.html script.js scripts/add_glp1_keto_filter.py
          git restore --staged .github/workflows || true

          if git diff --cached --quiet; then
            echo "Filter already installed."
          else
            git commit -m "Add GLP-1 ketogenic thematic filter"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Summary
        run: |
          echo "Added Scientific Library thematic filter:"
          echo "GLP-1-based therapies + ketogenic / ketosis / ketones"
