name: Restore Scientific Direction homepage

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  restore-scientific-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Scientific Direction section
        run: |
          if [ -f scripts/restore_scientific_direction_home.py ]; then
            python scripts/restore_scientific_direction_home.py
          elif [ -f restore_scientific_direction_home.py ]; then
            python restore_scientific_direction_home.py
          else
            echo "ERROR: restore_scientific_direction_home.py not found."
            exit 2
          fi

      - name: Commit homepage
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No homepage changes."
            exit 0
          fi

          git commit -m "Restore Scientific Direction on homepage"
          git pull --rebase origin main
          git push origin main
