name: Install Scientific Library login gate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install auth gate
        run: python scripts/install_library_auth_gate.py

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f library-gate.js
          test -f supabase-config.js
          test -f library-access.html
          grep -q "KR_LIBRARY_AUTH_GATE_V1" library.html
          grep -q "library-gate.js" library.html
          echo "Library gate verification passed."

      - name: Commit gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          git add library.html library-gate.js scripts/install_library_auth_gate.py

          if git diff --cached --quiet; then
            echo "Scientific Library login gate already current."
          else
            git commit -m "Protect Scientific Library with Supabase login"
            git pull --rebase origin main
            git push origin main
          fi
