name: LEGACY · Update literature + clinical rationales (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-literature
  cancel-in-progress: false

jobs:
  update-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curator dependency
        run: python -m pip install beautifulsoup4

      - name: Preserve previous Latest Evidence state
        run: cp latest-publications.json /tmp/latest-publications-before.json || true

      - name: Update and categorize PubMed literature
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          WINDOW_DAYS: "90"
          CURATION_WINDOW_DAYS: "365"
          MAX_RECORDS: "100"
          CURATION_MAX_RECORDS: "2000"
        run: python scripts/update_latest.py

      - name: Stamp evidence verification and content update dates
        run: python scripts/stamp_literature_status.py /tmp/latest-publications-before.json

      - name: Auto-promote eligible publications
        run: python scripts/promote_auto.py

      - name: Apply clinical-area rationales
        run: python scripts/apply_clinical_rationales.py

      - name: Rebuild Evidence Trends
        run: python scripts/build_evidence_trends.py

      - name: Commit changes
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-publications.json review-queue.json library.html index.html script.js evidence-trends.html data/evidence-trends.json
          if git diff --cached --quiet; then
            echo "No literature changes."
          else
            git commit -m "Update, categorize and curate scientific literature"
            git push
          fi
