name: Point site to protected Scientific Library

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Scientific Library links
        run: python scripts/point_to_protected_library.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Never let this workflow rewrite workflow files.
          git restore --source=HEAD --staged --worktree .github/workflows || true
          git clean -fd .github/workflows || true

          git add -- '*.html' script.js scripts/*.py scripts/point_to_protected_library.py

          if git diff --cached --quiet; then
            echo "All Scientific Library links already point to the protected domain."
          else
            git commit -m "Point Scientific Library links to protected domain"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Summary
        run: |
          echo "Scientific Library links now point to:"
          echo "https://library.ketogenicresearch.org"
