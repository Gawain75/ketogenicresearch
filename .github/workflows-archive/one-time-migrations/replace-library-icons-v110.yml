name: Replace Scientific Library icons

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Replace Library SVG icons
        run: python scripts/replace_library_icons_v110.py

      - name: Commit
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.html
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Replace Scientific Library clinical-area icons"
          git pull --rebase origin main
          git push origin main
