name: Seed early ketogenic literature

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  historical-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Add verified early ketogenic references
        run: |
          if [ -f scripts/seed_early_ketogenic_literature.py ]; then
            python scripts/seed_early_ketogenic_literature.py
          elif [ -f seed_early_ketogenic_literature.py ]; then
            python seed_early_ketogenic_literature.py
          else
            echo "ERROR: seed_early_ketogenic_literature.py not found."
            exit 2
          fi

      - name: Rebuild Evidence Trends
        run: |
          if [ -f scripts/build_evidence_trends.py ]; then
            python scripts/build_evidence_trends.py
          elif [ -f build_evidence_trends.py ]; then
            python build_evidence_trends.py
          else
            echo "Evidence Trends builder not present; skipping."
          fi

      - name: Commit historical references
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No historical changes."
            exit 0
          fi

          git commit -m "Add foundational ketogenic literature 1921-1926"
          git pull --rebase origin main
          git push origin main
