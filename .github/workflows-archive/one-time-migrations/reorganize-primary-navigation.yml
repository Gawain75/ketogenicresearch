name: Reorganize primary navigation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reorganize navigation
        run: |
          if [ -f scripts/reorganize_navigation.py ]; then
            python scripts/reorganize_navigation.py
          elif [ -f reorganize_navigation.py ]; then
            python reorganize_navigation.py
          else
            echo "ERROR: reorganize_navigation.py not found."
            exit 2
          fi

      - name: Commit navigation changes
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.html styles.css

          if git diff --cached --quiet; then
            echo "No navigation changes."
            exit 0
          fi

          git commit -m "Reorganize primary navigation"
          git pull --rebase origin main
          git push origin main
