name: Backfill 1921-1970 Scientific Library

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketogenicresearch-content-write
  cancel-in-progress: false

jobs:
  backfill-1921-1970:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curator dependency
        run: python -m pip install beautifulsoup4

      - name: Discover literature from 1921 to 1970
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          BACKFILL_MAX_RECORDS: "5000"
          RECONCILE_MAX: "0"
        run: |
          if [ -f scripts/backfill_1921_1970.py ]; then
            python scripts/backfill_1921_1970.py
          elif [ -f backfill_1921_1970.py ]; then
            python backfill_1921_1970.py
          else
            echo "ERROR: backfill_1921_1970.py not found."
            find . -maxdepth 2 -type f | sort
            exit 2
          fi

      - name: Promote verified historical records
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
          PROMOTION_BATCH_MAX: "400"
        run: |
          for n in 1 2 3 4; do
            echo "Promotion batch $n"
            if [ -f scripts/promote_auto_v5.py ]; then
              python scripts/promote_auto_v5.py
            elif [ -f promote_auto_v5.py ]; then
              python promote_auto_v5.py
            else
              echo "ERROR: promote_auto_v5.py not found."
              exit 2
            fi
          done

      - name: Rebuild Evidence Trends
        run: |
          if [ -f scripts/build_evidence_trends.py ]; then
            python scripts/build_evidence_trends.py
          elif [ -f build_evidence_trends.py ]; then
            python build_evidence_trends.py
          else
            echo "Evidence Trends builder not present; skipping."
          fi

      - name: Commit historical backfill
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No 1921-1970 Scientific Library changes."
            exit 0
          fi

          git commit -m "Backfill Scientific Library 1921-1970"
          git pull --rebase origin main
          git push origin main
