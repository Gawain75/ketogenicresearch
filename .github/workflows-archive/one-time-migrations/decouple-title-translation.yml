name: Decouple title translation from literature update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Disable translation inside main literature updater
        run: |
          if [ -f scripts/disable_translation_in_update.py ]; then
            python scripts/disable_translation_in_update.py
          else
            python disable_translation_in_update.py
          fi

      - name: Commit workflow fix
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No workflow changes."
            exit 0
          fi

          git commit -m "Decouple title translation from literature update"
          git pull --rebase origin main
          git push origin main
