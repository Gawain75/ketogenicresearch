name: Regenerate legacy articles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-legacy-articles
  cancel-in-progress: false

jobs:
  regenerate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install article dependencies
        run: python -m pip install pypdf

      - name: Regenerate one legacy article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: info@ketogenicresearch.org
        run: python scripts/regenerate_legacy_article.py

      - name: Re-render public article pages
        run: python scripts/render_articles.py

      - name: Commit regenerated article
        run: |
          git config user.name "Ketogenic Research Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add             articles-drafts/             articles/             articles.html

          if git diff --cached --quiet; then
            echo "No legacy article was changed."
          else
            git commit -m "Regenerate legacy research article"
            git push
          fi
