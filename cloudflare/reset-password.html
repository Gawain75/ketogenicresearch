<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password | Ketogenic Research Hub</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8fb;color:#163547}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#fff;border:1px solid #d9e5ec;border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(19,54,72,.12)}
h1{margin:8px 0 8px;font-size:34px}.note{color:#6d7f8b;line-height:1.5}
.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:800;font-size:13px}.field input{padding:12px;border:1px solid #cbd9e1;border-radius:10px;font:inherit}
button{margin-top:16px;width:100%;border:0;border-radius:11px;padding:13px;background:#146d87;color:#fff;font-weight:800}
.status{margin-top:14px;padding:10px 12px;border-radius:10px;background:#eef7f9}.error{background:#fff1f1;color:#a53535}
</style>
</head>
<body>
<main><section class="card">
<div style="font-weight:800">Ketogenic Research Hub — Scientific Library</div>
<h1>Nuova password</h1>
<p class="note">Inserisci e conferma la nuova password del tuo account.</p>
<form id="f">
<div class="field"><label>Nuova password</label><input id="p1" type="password" minlength="8" required></div>
<div class="field"><label>Ripeti password</label><input id="p2" type="password" minlength="8" required></div>
<button type="submit">Salva nuova password</button>
</form>
<div id="s" class="status" hidden></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
const c=window.supabase.createClient("https://kfctugbpwmjdupmtfjen.supabase.co","sb_publishable_fz-WHqnfABeqFiTjBz8Utg_psM2G6sY");
const s=document.getElementById('s');
function msg(t,e=false){s.hidden=false;s.textContent=t;s.className='status'+(e?' error':'');}
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1!==p2)return msg('Le password non coincidono.',true);
  const {error}=await c.auth.updateUser({password:p1});
  if(error)return msg(error.message,true);
  msg('Password aggiornata. Ora puoi accedere.');
  setTimeout(()=>location.href='/library-access.html',1200);
});
});
</script>
</body></html>
