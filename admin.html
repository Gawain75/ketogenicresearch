<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Site Admin | Ketogenic Research Hub</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><div class="admin-head"><div><div class="muted">KETOGENIC RESEARCH HUB</div><h1>Site Admin</h1></div><a class="btn btn-light" href="/">Apri sito</a></div><div class="admin-grid"><section class="admin-card"><h2>Pagine</h2><p class="muted">Crea pagine gestite dal backend. Le bozze non sono pubbliche.</p><div id="pages" class="pages"></div><hr><input id="editSlug" type="hidden"><div class="row"><label class="field">Titolo<input id="title"></label><label class="field">Slug<input id="slug" placeholder="es. collaborazioni"></label></div><label class="field">Meta description<input id="description"></label><label class="field">Stato<select id="status"><option value="draft">Bozza</option><option value="published">Pubblicata</option></select></label><label class="field">Contenuto HTML<textarea id="body" placeholder="<p>Contenuto della pagina...</p>"></textarea></label><div class="toolbar"><button class="btn btn-primary" id="savePage">Salva pagina</button><button class="btn btn-light" id="newPage">Nuova</button><button class="btn btn-danger" id="deletePage" hidden>Elimina</button></div><div id="pageStatus" class="status"></div></section><section class="admin-card"><h2>Menu</h2><p class="muted">Ordine, visibilità e posizione nel menu principale o in “Altro”. Le modifiche vengono applicate centralmente a tutto il sito.</p><div id="menuRows"></div><div class="toolbar"><button class="btn btn-light" id="addMenu">+ Aggiungi voce</button><button class="btn btn-primary" id="saveMenu">Salva menu</button></div><div id="menuStatus" class="status"></div></section></div></div><script src="admin.js"></script></body></html>
